<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moto</title>
    <style>
      :root {
        --hud: #f4efe6;
        --hud-dim: #a49c8e;
        --accent: #ffb340;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f12; }
      body {
        font: 500 14px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--hud);
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
      }

      .speedo {
        position: absolute;
        left: 28px;
        bottom: 24px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .speedo b {
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
      }
      .speedo span { font-size: 13px; color: var(--hud-dim); letter-spacing: 1px; }

      .boost {
        position: absolute;
        left: 30px;
        bottom: 98px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boost label {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--hud-dim);
      }
      .boost .bar {
        width: 130px;
        height: 6px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .boost i {
        display: block;
        height: 100%;
        width: 100%;
        background: #6b6560;
      }
      .boost.ready label { color: var(--hud); }
      .boost.ready i { background: var(--accent); }
      .boost.active label { color: var(--accent); font-weight: 700; }
      .boost.active i { background: #fff8ea; }

      /*
       * The airtime readout and the landing banner share one slot, and only one
       * of them is ever up: you are either in the air or you have just landed.
       * They are two states of the same question — what is this flight worth —
       * so giving each its own patch of screen was wrong twice over. Stacked,
       * the pair reached 46% of viewport height, and the camera holds the bike
       * at 73% with the horizon at 41%: that put the banner exactly on the
       * ground you read the next feature off. Sharing one slot ends the box at
       * ~28%, which is sky in every state the camera can be in.
       *
       * `.air` stays in flow and defines the box; `.landing` is laid over it.
       * The air block keeps its box when hidden, so nothing shifts between a
       * grounded and an airborne frame.
       */
      .centre {
        position: absolute;
        left: 50%;
        top: 13%;
        transform: translateX(-50%);
        text-align: center;
      }

      .air {
        opacity: 0;
        transition: opacity 120ms linear;
      }
      .air.on { opacity: 1; }
      .air b {
        display: block;
        font-size: 44px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        letter-spacing: -1px;
      }
      .air span { font-size: 12px; color: var(--hud-dim); letter-spacing: 2px; }
      /* Trick names, appearing as each rotation completes. */
      .air em {
        display: block;
        margin-top: 10px;
        font-style: normal;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      /* What the flight is currently worth — the number you stand to lose. */
      .air i {
        display: block;
        margin-top: 2px;
        font-style: normal;
        font-size: 19px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .score {
        position: absolute;
        right: 28px;
        /* Clear of the collapsed tuning panel, which owns the top-right corner. */
        top: 36px;
        text-align: right;
      }
      .score > b {
        display: block;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
      }
      .score > span {
        display: block;
        font-size: 11px;
        color: var(--hud-dim);
        letter-spacing: 2px;
      }
      .score .best { margin-top: 8px; }
      .score .best i {
        font-style: normal;
        color: var(--hud);
        font-variant-numeric: tabular-nums;
      }
      .combo {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity 150ms linear;
      }
      .combo.on { opacity: 1; }

      .landing {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 220ms ease-out;
      }
      .landing.show { opacity: 1; }
      .landing b {
        display: block;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .landing span {
        display: block;
        font-size: 11px;
        color: var(--hud-dim);
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .landing em {
        display: block;
        margin-top: 2px;
        font-style: normal;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .landing u {
        display: block;
        margin: 3px 0 4px;
        text-decoration: none;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .landing.clean b, .landing.clean u { color: #6ee06e; }
      .landing.sketchy b, .landing.sketchy u { color: #ffb340; }
      .landing.bad b, .landing.bad u { color: #e8563f; }

      /*
       * The trial clock sits above the airtime slot rather than beside the
       * score, in the band between the top of the screen and the 13% where
       * `.centre` begins. That band is the only part of the HUD nothing else
       * claims — the hint owns the top left and the tuning panel the top right —
       * and a countdown has to be readable without looking away from the jump.
       *
       * When a run ends the clock is replaced by the result rather than stacked
       * above it, and `.centre` is hidden outright, so the two can never argue
       * over the same rows on a short window. That is the right precedence as
       * well as the convenient one: once the clock has stopped, a landing banner
       * is reporting points that no longer exist, and the only thing worth
       * saying in the middle of the screen is what the run was worth.
       */
      .trial {
        position: absolute;
        left: 50%;
        top: 3.2%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        transition: opacity 220ms ease;
      }
      .trial.on, .trial.over { opacity: 1; }
      .trial b {
        display: block;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
      }
      .trial span {
        display: block;
        font-size: 11px;
        color: var(--hud-dim);
        letter-spacing: 2px;
      }
      /* The last seconds, when a rider is deciding whether to take one more. */
      .trial.low b { color: #e8563f; }
      .trial .result { display: none; }
      .trial.over .clock { display: none; }
      .trial.over .result { display: block; }
      #hud.trialover .centre { display: none; }
      .trial .result u {
        display: block;
        text-decoration: none;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .trial .result em {
        display: block;
        margin-top: 4px;
        font-style: normal;
        font-size: 11px;
        color: var(--hud-dim);
        letter-spacing: 1px;
      }
      .trial .result em i {
        font-style: normal;
        color: var(--hud);
        font-variant-numeric: tabular-nums;
      }
      .trial .result em kbd {
        display: inline-block;
        min-width: 18px;
        padding: 0 4px;
        border: 1px solid #4a463f;
        border-bottom-width: 2px;
        border-radius: 4px;
        color: var(--hud);
        font: inherit;
      }

      #stats {
        position: absolute;
        right: 18px;
        bottom: 14px;
        text-align: right;
        font-size: 12px;
        color: var(--hud-dim);
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }

      #hint {
        position: absolute;
        left: 28px;
        top: 16px;
        font-size: 12px;
        color: var(--hud-dim);
        line-height: 1.8;
      }
      #hint kbd {
        display: inline-block;
        min-width: 20px;
        padding: 1px 5px;
        margin-right: 2px;
        border: 1px solid #4a463f;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: rgba(20, 22, 26, 0.55);
        color: var(--hud);
        font: inherit;
        text-align: center;
      }
      #hint.fade { opacity: 0.22; transition: opacity 600ms ease; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="hint">
        <kbd>W</kbd><kbd>S</kbd> throttle / brake &nbsp; <kbd>A</kbd><kbd>D</kbd> steer &nbsp;
        <kbd>Space</kbd> jump<br />
        <kbd>Shift</kbd><kbd>E</kbd> boost — tap it, on the ground<br />
        <kbd>↑</kbd><kbd>↓</kbd> lean fwd / back &nbsp; <kbd>←</kbd><kbd>→</kbd> roll
        <span style="opacity: 0.6">(in the air)</span><br />
        <kbd>R</kbd> respawn &nbsp; <kbd>T</kbd> 3-minute time trial &nbsp;
        <kbd>H</kbd> hide tuning panel
      </div>
      <div class="speedo"><b id="speed">0</b><span>KM/H</span></div>
      <div class="boost ready" id="boost">
        <label>BOOST</label>
        <div class="bar"><i id="boostfill"></i></div>
      </div>
      <div class="trial" id="trial">
        <div class="clock">
          <b id="trialclock">3:00</b><span id="triallabel">TIME TRIAL</span>
        </div>
        <div class="result">
          <u id="trialscore">0</u>
          <em><i id="trialbest">BEST 0</i> &nbsp;·&nbsp; <kbd>T</kbd> again &nbsp;
            <kbd>R</kbd> free ride</em>
        </div>
      </div>
      <div class="centre">
        <div class="air" id="air">
          <b id="airtime">0.00</b><span>AIR TIME</span>
          <em id="tricktext"></em><i id="trickpoints"></i>
        </div>
        <div class="landing" id="landing">
          <b id="landingband">CLEAN</b>
          <em id="landingtrick"></em>
          <u id="landingscore"></u>
          <span id="landingdetail"></span>
        </div>
      </div>
      <div class="score" id="score">
        <div class="combo" id="combo">×<span id="combovalue">1</span></div>
        <b id="scorevalue">0</b><span>SCORE</span>
        <span class="best">BEST <i id="scorebest">0</i></span>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
